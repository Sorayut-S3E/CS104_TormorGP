{% extends "base.html" %}
{% block title %}{{ action }} Merchandise — MotoGP Universe{% endblock %}
{% block content %}
<div class="page">
  <div class="section-header">
    <h1>🛍️ {{ action }} Merchandise</h1>
    <div class="bar"></div>
    <a href="/merchandise" class="btn btn-edit">← กลับ</a>
  </div>
  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Team</label>
        <select name="team_id" required>
          <option value="">-- เลือกทีม --</option>
          {% for t in teams %}
          <option value="{{ t.id }}" {% if data and data.team_id == t.id %}selected{% endif %}>{{ t.team }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>🧥 ราคา Coat (USD)</label>
        <input type="number" step="0.01" name="coat" value="{{ data.coat if data else '' }}" placeholder="299.99">
      </div>
      <div class="form-group">
        <label>👕 ราคา Shirt (USD)</label>
        <input type="number" step="0.01" name="shirt" value="{{ data.shirt if data else '' }}" placeholder="89.99">
      </div>
      <div class="form-group">
        <label>🪖 ราคา Helmet (USD)</label>
        <input type="number" step="0.01" name="helmet" value="{{ data.helmet if data else '' }}" placeholder="599.99">
      </div>
      <div class="form-group">
        <label>🧢 ราคา Cap (USD)</label>
        <input type="number" step="0.01" name="cap" value="{{ data.cap if data else '' }}" placeholder="39.99">
      </div>
      <button type="submit" class="btn btn-primary">💾 บันทึก</button>
    </form>
  </div>
</div>
{% endblock %}
