{% extends "base.html" %}
{% block title %}{{ action }} Result — MotoGP Universe{% endblock %}
{% block content %}
<div class="page">
  <div class="section-header">
    <h1>🏁 {{ action }} Result</h1>
    <div class="bar"></div>
    <a href="/results" class="btn btn-edit">← กลับ</a>
  </div>
  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Race (รอบการแข่งขัน)</label>
        <select name="calendar_id" required>
          <option value="">-- เลือกรอบแข่ง --</option>
          {% for c in calendars %}
          <option value="{{ c.id }}" {% if data and data.calendar_id == c.id %}selected{% endif %}>{{ c.date }} — {{ c.track }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Result (ชื่อการแข่ง)</label>
        <input type="text" name="result" value="{{ data.result if data else '' }}" placeholder="เช่น Qatar GP 2025 - Bagnaia wins" required>
      </div>
      <div class="form-group">
        <label>Standing (อันดับผู้ชนะ)</label>
        <input type="number" name="standing" value="{{ data.standing if data else '1' }}" min="1" placeholder="1">
      </div>
      <div class="form-group">
        <label>Records (สถิติ)</label>
        <textarea name="records" placeholder="เช่น Fastest lap: 1:53.247 - Bagnaia">{{ data.records if data else '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">💾 บันทึก</button>
    </form>
  </div>
</div>
{% endblock %}
