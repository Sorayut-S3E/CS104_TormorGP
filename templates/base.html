<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MotoGP Universe{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E10600;
      --red-dark: #9A0000;
      --gold: #FFB800;
      --dark: #0A0A0A;
      --dark2: #111111;
      --dark3: #1A1A1A;
      --dark4: #222222;
      --text: #F0F0F0;
      --muted: #888;
      --border: #2A2A2A;
      --accent: #E10600;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      background: var(--dark2);
      border-bottom: 2px solid var(--red);
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center;
      padding: 0 2rem;
      height: 64px;
    }
    .nav-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.6rem;
      color: var(--red);
      letter-spacing: 2px;
      text-decoration: none;
      margin-right: 2.5rem;
      white-space: nowrap;
    }
    .nav-logo span { color: var(--gold); }
    .nav-links { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text);
      background: var(--red);
    }

    /* PAGE WRAPPER */
    .page { max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* SECTION HEADER */
    .section-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .section-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .section-header .bar {
      flex: 1; height: 2px;
      background: linear-gradient(90deg, var(--red), transparent);
    }

    /* TABLE */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--dark3); }
    thead th {
      padding: 0.9rem 1rem;
      text-align: left;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    tbody tr { border-top: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: var(--dark3); }
    tbody td { padding: 0.85rem 1rem; font-size: 0.92rem; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .badge-gold { background: var(--gold); color: #000; }
    .badge-silver { background: #C0C0C0; color: #000; }
    .badge-bronze { background: #CD7F32; color: #fff; }
    .badge-red { background: var(--red); color: #fff; }

    /* BUTTONS */
    .btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: 4px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: var(--red-dark); }
    .btn-edit { background: #2A3A5A; color: #7EB3FF; }
    .btn-edit:hover { background: #3A4A6A; }
    .btn-delete { background: #3A1A1A; color: #FF7070; }
    .btn-delete:hover { background: #4A2A2A; }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.75rem; }

    /* FORM */
    .form-card {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
      max-width: 640px;
    }
    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input, textarea, select {
      width: 100%;
      background: var(--dark4);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.9rem;
      border-radius: 5px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--red);
    }
    textarea { resize: vertical; min-height: 80px; }

    /* CARDS GRID */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--red); transform: translateY(-2px); }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .card-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }

    /* STAT BARS */
    .stat-bar-wrap { margin: 0.3rem 0; }
    .stat-bar-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 3px; }
    .stat-bar { height: 6px; background: var(--dark4); border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: var(--red); border-radius: 3px; }

    /* HERO BANNER */
    .hero {
      background: linear-gradient(135deg, var(--dark2) 0%, #1A0000 50%, var(--dark2) 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: 'MOTOGP';
      position: absolute;
      right: -1rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 8rem;
      color: rgba(225,6,0,0.05);
      pointer-events: none;
    }
    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      line-height: 1;
    }
    .hero h1 span { color: var(--red); }
    .hero p { color: var(--muted); margin-top: 0.5rem; font-size: 1rem; }

    /* STAT MINI CARDS */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-mini {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .stat-mini-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: var(--red);
    }
    .stat-mini-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* SECTION TITLE */
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-left: 3px solid var(--red);
      padding-left: 0.75rem;
      margin-bottom: 1rem;
    }

    /* FLAG EMOJI */
    .flag { font-size: 1.1rem; margin-right: 0.3rem; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 3rem;
    }
    footer span { color: var(--red); }

    /* COMPARE */
    .compare-grid { display: grid; grid-template-columns: 1fr 60px 1fr; gap: 1rem; align-items: start; margin-top: 1.5rem; }
    .compare-vs {
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      color: var(--gold);
      margin-top: 3rem;
    }
    .compare-card {
      background: var(--dark3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }
    .compare-card h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: var(--red);
    }
    .compare-row {
      display: flex; justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .compare-row:last-child { border-bottom: none; }
    .compare-row .key { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

    /* ACTIONS ROW */
    .actions-row { display: flex; gap: 0.5rem; align-items: center; }

    @media (max-width: 640px) {
      .compare-grid { grid-template-columns: 1fr; }
      .compare-vs { display: none; }
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">MOTO<span>GP</span></a>
  <div class="nav-links">
    <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>หน้าแรก</a>
    <a href="/teams" {% if request.endpoint == 'teams' %}class="active"{% endif %}>Teams</a>
    <a href="/merchandise" {% if request.endpoint == 'merchandise' %}class="active"{% endif %}>Merchandise</a>
    <a href="/tracks" {% if request.endpoint == 'tracks' %}class="active"{% endif %}>Tracks</a>
    <a href="/calendar" {% if request.endpoint == 'calendar' %}class="active"{% endif %}>Calendar</a>
    <a href="/results" {% if request.endpoint == 'results' %}class="active"{% endif %}>Results</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  &copy; 2025 <span>MotoGP Universe</span> — Built with Flask & SQLite
</footer>
</body>
</html>
